# Contract Addresses
pools:
  - address: "0000000000000000000000000000000000001017" # ETHST-USDST pool
  - address: "000000000000000000000000000000000000101b" # GOLDST-USDST pool
  - address: "000000000000000000000000000000000000101d" # SILVST-USDST pool
# Trading Parameters
trading:
  fee_bps: 30 # Pool fee in basis points (0.3%)
  min_profit: 0.01 # $0.01 minimum profit

# Oracle Configuration
oracle:
  timeout: 10 # API request timeout in seconds
  blockapps_price_oracle: "0000000000000000000000000000000000001002" # BlockApps on-chain price oracle address

# CDP Liquidation Settings
liquidation:
  enabled: true

# Execution Settings
execution:
  execution_interval: 300 # seconds between scans
  vault_addr: "34bc729f66106a146b0864e673a3571b28fa23e1" # this is mainnet vault address
